plugins {
    id 'java'
}

dependencies {
    implementation project(':core:domain')
    implementation project(':core:application')
    
    // Spring Boot (required for @Component, @Configuration, logging)
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.retry:spring-retry:2.0.5'
    implementation 'org.springframework.boot:spring-boot-starter-aop'
    
    // SLF4J / Logging (already included in spring-boot-starter)
    implementation 'org.slf4j:slf4j-api'
    implementation 'ch.qos.logback:logback-classic'
    
    // JSON serialization for iDoc
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.fasterxml.jackson.core:jackson-databind'

    // Kafka Message Broker - Phase 3 (Event Sourcing)
    implementation 'org.springframework.kafka:spring-kafka'
    testImplementation 'org.springframework.kafka:spring-kafka-test'

    // TODO: Uncomment in production for real SAP JCo integration
    // implementation 'com.sap.conn.jco:sapjco:3.1.5' (requires SAP JCo library)
    
    // TODO: spring-cloud-azure-starter-servicebus:5.10.0 será adicionado na Fase 2
    // implementation 'org.springframework.cloud:spring-cloud-azure-starter-servicebus:5.10.0'
}

tasks.named('test') {
    useJUnitPlatform()
}
