plugins {
    id 'java'
    id 'org.springframework.boot'
}

dependencies {
    implementation project(':core:domain')
    implementation project(':core:application')
    implementation project(':adapter:in:rest')
    implementation project(':adapter:out:persistence')
    implementation project(':adapter:out:messaging')
    implementation project(':infrastructure:config')
    implementation project(':infrastructure:observability')
    
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    
    // Phase 3: Event Sourcing & Message Broker
    implementation 'org.springframework.cloud:spring-cloud-starter-stream-kafka'
    implementation 'org.springframework.kafka:spring-kafka'
    implementation 'org.apache.kafka:kafka-clients'
    
    // Test dependencies
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'com.h2database:h2'
}

springBoot {
    mainClass = 'com.orderintegration.bootstrap.OrderIntegrationApplication'
}

bootJar {
    archiveFileName = 'order-integration-platform.jar'
}

tasks.named('test') {
    useJUnitPlatform()
}
