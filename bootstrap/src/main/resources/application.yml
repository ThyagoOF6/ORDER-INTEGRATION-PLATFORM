spring:
  application:
    name: order-integration-platform

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:order_integration_db}
    username: ${DB_USER:order_user}
    password: ${DB_PASSWORD:order_password}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://login.microsoftonline.com/common/v2.0

server:
  port: 8080
  servlet:
    context-path: /api

springdoc:
  api-docs:
    path: /docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

logging:
  level:
    root: INFO
    com.orderintegration: DEBUG
  pattern:
    console: "%d{ISO8601} [%thread] %-5level %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true

# SAP Configuration
sap:
  rfc:
    host: ${SAP_HOST:localhost}
    port: ${SAP_PORT:3200}
    client: ${SAP_CLIENT:100}
    user: ${SAP_USER:DEVELOPER}
    password: ${SAP_PASSWORD:}
    language: EN
    function-module-create-order: ZORDERS_CREATE
    function-module-update-order: ZORDERS_UPDATE
    max-retries: 3
    retry-delay-ms: 5000
    connection-timeout-ms: 30000
  idoc:
    message-type: ORDERS
    process-code: CRMORD
    port-dest: /APP/ORDER_INTEGRATION
